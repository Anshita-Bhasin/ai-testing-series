description: "Assertion 2: contains - Case-sensitive string matching"

prompts:
  - |
    Extract product information from the following description and return it as JSON with these fields:
    - name (string)
    - price (number)
    - storage (string)
    - color (string, if available)

    Product: {{product_description}}

    Return only valid JSON, no additional text.

providers:
  - groq:llama-3.1-8b-instant

tests:
  - description: "Test 1: Contains exact brand name 'Samsung' (case-sensitive)"
    vars:
      product_description: "Samsung Galaxy S24 - $899, 256GB, Phantom Black"
    assert:
      - type: is-json
      - type: contains
        value: "samsung"

  - description: "Test 2: Contains exact color 'Phantom Black' (multi-word substring)"
    vars:
      product_description: "Samsung Galaxy S24 - $899, 256GB, Phantom Black"
    assert:
      - type: is-json
      - type: contains
        value: "Phantom Black"

  - description: "Test 3: Contains exact storage unit 'GB' (case-sensitive)"
    vars:
      product_description: "MacBook Pro 14 - $1999, 512GB SSD, Space Gray"
    assert:
      - type: is-json
      - type: contains
        value: "GB"
