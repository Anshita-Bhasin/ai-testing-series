description: "Assertion 7: contains-all - All required strings must be present"

prompts:
  - |
    Extract product information from the following description and return it as JSON with these fields:
    - name (string)
    - price (number)
    - storage (string)
    - color (string, if available)

    Product: {{product_description}}

    Return only valid JSON, no additional text.

providers:
  - groq:llama-3.1-8b-instant

tests:
  - description: "Test 1: All required JSON fields present"
    vars:
      product_description: "iPhone 15 Pro - $999, 256GB, Titanium Blue"
    assert:
      - type: is-json
      - type: contains-all
        value:
          - "name"
          - "price"
          - "storage"
          - "color"

  - description: "Test 2: Product details all included"
    vars:
      product_description: "Sony WH-1000XM5 - $399, Black, Wireless"
    assert:
      - type: is-json
      - type: contains-all
        value:
          - "Sony"
          - "399"
          - "Black"

  - description: "Test 3: Brand, model and specs present"
    vars:
      product_description: "Dell XPS 13 - $1299, 512GB, Platinum Silver"
    assert:
      - type: is-json
      - type: contains-all
        value:
          - "Dell"
          - "1099"
          - "512"
