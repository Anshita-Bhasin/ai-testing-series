description: "Assertion 3: icontains - Case-insensitive string matching"

prompts:
  - |
    Extract product information from the following description and return it as JSON with these fields:
    - name (string)
    - price (number)
    - storage (string)
    - color (string, if available)

    Product: {{product_description}}

    Return only valid JSON, no additional text.

providers:
  - groq:llama-3.1-8b-instant

tests:
  - description: "Test 1: Contains 'pixel' (case-insensitive)"
    vars:
      product_description: "Google Pixel 8 Pro - $999, 128GB, Obsidian"
    assert:
      - type: is-json
      - type: icontains
        value: "pixel"

  - description: "Test 2: Contains 'APPLE' (case-insensitive)"
    vars:
      product_description: "Apple MacBook Air - $1099, 256GB, Midnight"
    assert:
      - type: is-json
      - type: icontains
        value: "APPLE"

  - description: "Test 3: Contains 'OnEpLuS' (mixed case)"
    vars:
      product_description: "OnePlus 12 - $799, 512GB, Marble Gray"
    assert:
      - type: is-json
      - type: icontains
        value: "OnEpLuS"
